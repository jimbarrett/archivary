<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>
  <!-- Dark circular background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Stylized A clipped to circle — legs extend to edges -->
  <g clip-path="url(#circleClip)">
    <!-- Unified A shape -->
    <path d="
      M 256,24
      L 440,504 L 320,504 L 300,350 L 212,350
      L 192,504 L 72,504 Z
      M 256,145 L 216,310 L 296,310 Z
    " fill="url(#letterGrad)" fill-rule="evenodd"/>
  </g>
</svg>
