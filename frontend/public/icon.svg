<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark circular background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Stylized A with a subtle glow -->
  <g filter="url(#glow)">
    <path d="
      M 256 88
      L 148 400
      L 188 400
      L 212 328
      L 300 328
      L 324 400
      L 364 400
      Z
      M 224 292
      L 256 200
      L 288 292
      Z
    " fill="url(#letterGrad)" fill-rule="evenodd"/>
  </g>
  <!-- Subtle accent line under the crossbar -->
  <line x1="200" y1="340" x2="312" y2="340" stroke="#4ade80" stroke-width="3" opacity="0.3"/>
</svg>
