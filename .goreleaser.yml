version: 2

before:
  hooks:
    - npm ci --prefix frontend
    - npm run build --prefix frontend

builds:
  - main: ./cmd/archivary
    binary: archivary
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: binary
    name_template: "archivary_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
