version: 2

before:
  hooks:
    - npm ci --prefix frontend
    - npm run build --prefix frontend

builds:
  - main: ./cmd/archivary
    binary: archivary
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: binary
    name_template: "archivary_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  header: |
    ## Installation

    Download the binary for your platform below, then:

    ```bash
    # Linux / macOS
    chmod +x archivary_*
    sudo mv archivary_* /usr/local/bin/archivary

    # Then run from anywhere
    archivary serve
    ```

    See the [README](https://github.com/jimbarrett/archivary#installation) for full details.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
