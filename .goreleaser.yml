version: 2

before:
  hooks:
    - npm ci --prefix frontend
    - npm run build --prefix frontend

builds:
  - main: ./cmd/archivary
    binary: archivary
    ldflags:
      - -s -w -X main.version={{.Tag}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      # - darwin
      # - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: binary
    name_template: "archivary_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  header: |
    ## Installation

    Download the binary for your platform below, then:

    ```bash
    mkdir -p ~/.local/bin
    chmod +x archivary_*
    mv archivary_* ~/.local/bin/archivary
    ```

    If `~/.local/bin` is not on your PATH, add this to your shell profile:

    ```bash
    export PATH="$HOME/.local/bin:$PATH"
    ```

    Then run from anywhere:

    ```bash
    archivary serve
    ```

    To update an existing install:

    ```bash
    archivary update
    ```

    See the [README](https://github.com/jimbarrett/archivary#installation) for full details.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
